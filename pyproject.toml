[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deerctl"
version = "0.1.0"
description = "Remap and configure Drunkdeer keyboards on Linux and macOS"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Syed Ali (xuckless)" }]
dependencies = ["hidapi>=0.14; sys_platform != 'linux'"]

[project.scripts]
deerctl = "deerctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deerctl = ["models.json", "static/*.html"]
